upstream bookmark-service {
    server bookmark_service:8080;
}

upstream frontend {
    server frontend:8080;
}

server {
    listen 80;
    server_name temazlink.me www.temazlink.me;

    location /api/bookmark_service/ {
        proxy_pass http://bookmark-service/;
    }

    location ~ "^/(?<short_code>[A-Za-z0-9]{7})$" {
        rewrite ^ /v1/links/redirect/$short_code break;
        proxy_pass http://bookmark-service;
    }

    location / {
        proxy_pass http://frontend/;
    }
}
