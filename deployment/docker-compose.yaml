services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookmark_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data:z

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data:z

  bookmark_service:
    image: bookmark_service:dev
    build:
      context: ..
    restart: always
    container_name: bookmark_service
    env_file:
      - ./bookmark-service/.env
    volumes:
      - ../private.key:/app/private.key:ro
      - ../public.key:/app/public.key:ro
    depends_on:
      - postgres
      - redis

  frontend:
    image: frontend:dev
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/bookmark_service}
        VITE_PUBLIC_REDIRECT_BASE_URL: ${VITE_PUBLIC_REDIRECT_BASE_URL:-https://temazlink.me}
        VITE_APP_NAME: ${VITE_APP_NAME:-ShortenLink}
    restart: always
    container_name: frontend

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bookmark_service
      - frontend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx