basePath: /
definitions:
  bookmark.createInput:
    properties:
      description:
        maxLength: 255
        type: string
      url:
        maxLength: 255
        type: string
    required:
    - description
    - url
    type: object
  bookmark.createResponse:
    properties:
      data:
        $ref: '#/definitions/model.Bookmark'
      message:
        type: string
    type: object
  bookmark.listResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Bookmark'
        type: array
      pagination:
        $ref: '#/definitions/bookmark.pagination'
    type: object
  bookmark.pagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  bookmark.updateInput:
    properties:
      description:
        maxLength: 255
        type: string
      url:
        maxLength: 255
        type: string
    required:
    - description
    - url
    type: object
  model.Bookmark:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  model.Message:
    properties:
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
  model.User:
    properties:
      email:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  response.Message:
    properties:
      details: {}
      message:
        type: string
    type: object
  url.shortenInputBody:
    properties:
      exp:
        maximum: 604800
        type: integer
      url:
        type: string
    required:
    - exp
    - url
    type: object
  url.shortenResMessage:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  user.loginInput:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  user.registerInput:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
info:
  contact: {}
  description: API documentation for bookmark service.
  title: Bookmark API
  version: "1.0"
paths:
  /health-check:
    get:
      consumes:
      - application/json
      description: Health check function
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Message'
      summary: Health check function
      tags:
      - health-check
  /v1/bookmarks:
    get:
      description: List paginated bookmarks for the authenticated user
      parameters:
      - description: Page number, default 1
        in: query
        name: page
        type: integer
      - description: Items per page, default 20, maximum 100
        in: query
        name: limit
        type: integer
      - description: created_at, updated_at, description, or url
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bookmark.listResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Message'
      security:
      - BearerAuth: []
      summary: List bookmarks
      tags:
      - bookmark
    post:
      consumes:
      - application/json
      description: Create a bookmark for the authenticated user
      parameters:
      - description: Bookmark input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/bookmark.createInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bookmark.createResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Message'
      security:
      - BearerAuth: []
      summary: Create a bookmark
      tags:
      - bookmark
  /v1/bookmarks/{id}:
    delete:
      description: Delete a bookmark owned by the authenticated user
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Message'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Message'
      security:
      - BearerAuth: []
      summary: Delete a bookmark
      tags:
      - bookmark
    put:
      consumes:
      - application/json
      description: Update a bookmark owned by the authenticated user
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: string
      - description: Bookmark input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/bookmark.updateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Message'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Message'
      security:
      - BearerAuth: []
      summary: Update a bookmark
      tags:
      - bookmark
  /v1/links/redirect/{code}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Shorten code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
      tags:
      - link
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Generate shorten url based on original url that last upto 7 days
      parameters:
      - description: Input required
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/url.shortenInputBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/url.shortenResMessage'
      summary: Generate shorten url based on original url that last upto 7 days
      tags:
      - link
  /v1/self/info:
    get:
      consumes:
      - application/json
      description: Get self info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get self info
      tags:
      - user
  /v1/users/login:
    post:
      consumes:
      - application/json
      description: Login an existing user with username and password
      parameters:
      - description: User login info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.loginInput'
      produces:
      - application/json
      responses:
        "200":
          description: User successfully logged in
          schema:
            $ref: '#/definitions/response.Message'
        "400":
          description: Invalid input parameters
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Message'
      summary: Login an existing user
      tags:
      - user
  /v1/users/register:
    post:
      consumes:
      - application/json
      description: Create a new user with username, email, and password
      parameters:
      - description: User registration info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.registerInput'
      produces:
      - application/json
      responses:
        "200":
          description: User successfully registered
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Invalid input parameters
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Message'
      summary: Register a new user account
      tags:
      - user
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
