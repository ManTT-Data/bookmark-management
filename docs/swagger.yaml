basePath: /
definitions:
  handler.shortenInputBody:
    properties:
      exp:
        maximum: 604800
        type: integer
      url:
        type: string
    required:
    - exp
    - url
    type: object
  handler.shortenResMessage:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  model.Message:
    properties:
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
  model.User:
    properties:
      email:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  response.Message:
    properties:
      details: {}
      message:
        type: string
    type: object
  user.registerInput:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
info:
  contact: {}
  description: API documentation for bookmark service.
  title: Bookmark API
  version: "1.0"
paths:
  /health-check:
    get:
      consumes:
      - application/json
      description: Health check function
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Message'
      summary: Health check function
      tags:
      - health-check
  /v1/links/redirect/{code}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Shorten code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
      tags:
      - link
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Generate shorten url based on original url that last upto 7 days
      parameters:
      - description: Input required
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.shortenInputBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.shortenResMessage'
      summary: Generate shorten url based on original url that last upto 7 days
      tags:
      - link
  /v1/users/register:
    post:
      consumes:
      - application/json
      description: Create a new user with username, email, and password
      parameters:
      - description: User registration info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.registerInput'
      produces:
      - application/json
      responses:
        "200":
          description: User successfully registered
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Invalid input parameters
          schema:
            $ref: '#/definitions/response.Message'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Message'
      summary: Register a new user account
      tags:
      - user
swagger: "2.0"
